name: build-linux72

# Valve's Steam Frame kernel (Linux 7.2) with SM8250 support at a pinned commit, plus kernel/linux72.
# Result: a stage 1 boot image (fastboot boot, nothing flashed) with a USB shell, and the kernel files.

on:
  workflow_dispatch:
    inputs:
      linux_commit:
        description: "kernel source commit"
        default: "a47ef53148a9bcf3e46156bfd15cfaad4b5058cd"
  push:
    paths:
      - "kernel/linux72/**"
      - ".github/workflows/build-linux72.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LINUX_COMMIT: ${{ inputs.linux_commit || 'a47ef53148a9bcf3e46156bfd15cfaad4b5058cd' }}
      DTB: sm8250-oculus-hollywood
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc bison flex libssl-dev \
            libelf-dev dwarves cpio ccache python3 device-tree-compiler kmod

      - name: Kernel tree
        run: |
          mkdir linux && cd linux
          git init -q
          git remote add origin https://github.com/overpressure/linux.git
          git fetch -q --depth 1 origin "$LINUX_COMMIT"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %s'

      - name: Compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux72-${{ env.LINUX_COMMIT }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux72-${{ env.LINUX_COMMIT }}-
            ccache-linux72-

      - name: Quest 2 layer
        run: |
          Q=arch/arm64/boot/dts/qcom
          cp kernel/linux72/$DTB.dts kernel/linux72/$DTB-dtbo-sink.dtsi linux/$Q/
          grep -q "$DTB.dtb" linux/$Q/Makefile || echo "dtb-\$(CONFIG_ARCH_QCOM) += $DTB.dtb" >> linux/$Q/Makefile
          cp kernel/linux72/hollywood.config linux/arch/arm64/configs/hollywood.config
          P=linux/drivers/gpu/drm/panel
          cp kernel/linux72/panel-oculus-hollywood-jdi.c $P/
          grep -q OCULUS_HOLLYWOOD_JDI $P/Kconfig || cat kernel/linux72/Kconfig.panel >> $P/Kconfig
          grep -q oculus-hollywood-jdi $P/Makefile || echo 'obj-$(CONFIG_DRM_PANEL_OCULUS_HOLLYWOOD_JDI) += panel-oculus-hollywood-jdi.o' >> $P/Makefile
          grep -q '"pico4,compatible"' linux/drivers/of/fdt.c
          sed -i 's/"pico4,compatible"/"quest2,compatible"/; s/"pico4,model"/"quest2,model"/' linux/drivers/of/fdt.c
          grep -q '"quest2,compatible"' linux/drivers/of/fdt.c
          F=linux/drivers/gpu/drm/drm_fb_helper.c
          sed -i 's/^	drm_fb_helper_restore_fbdev_mode_unlocked(dev->fb_helper);$/	drm_fb_helper_restore_fbdev_mode_unlocked(dev->fb_helper, false);/' $F
          ! grep -q 'drm_fb_helper_restore_fbdev_mode_unlocked(dev->fb_helper);' $F

      - name: Configure
        run: |
          cd linux
          M="make O=../out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-"
          mkdir -p ../out
          cp arch/arm64/configs/gabe_defconfig ../out/.config
          scripts/kconfig/merge_config.sh -m -O ../out ../out/.config arch/arm64/configs/hollywood.config >/dev/null
          $M olddefconfig >/dev/null
          bad=0
          while IFS= read -r line; do
            case $line in
            CONFIG_*=*) grep -qxF "$line" ../out/.config || { echo "not applied: $line"; bad=1; } ;;
            esac
          done < arch/arm64/configs/hollywood.config
          exit $bad

      - name: Build
        run: |
          cd linux
          make O=../out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache aarch64-linux-gnu-gcc" \
            -j"$(nproc)" JOBS=1 Image "qcom/$DTB.dtb"
          ccache -s | grep -iE "hits|misses|size" || true
          ls -l ../out/arch/arm64/boot/Image ../out/arch/arm64/boot/dts/qcom/$DTB.dtb

      - name: Save compiler cache
        if: ${{ always() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux72-${{ env.LINUX_COMMIT }}-${{ github.run_id }}

      - name: Stage 1 ramdisk
        run: |
          set -e
          A=https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64
          f=$(curl -fsSL $A/ | grep -o 'busybox-static-[0-9][^"]*\.apk' | head -n 1)
          curl -fsSL -o bb.apk "$A/$f"
          mkdir bb && tar -xzf bb.apk -C bb 2>/dev/null || true
          mkdir -p rd/bin
          cp bb/bin/busybox.static rd/bin/busybox
          file rd/bin/busybox
          install -m 755 kernel/linux72/stage1/init rd/init
          aarch64-linux-gnu-gcc -static -O2 -o rd/bin/q2reboot kernel/linux72/stage1/q2reboot.c
          aarch64-linux-gnu-strip rd/bin/q2reboot
          sed -i 's/\r$//' rd/init
          (cd rd && find . | cpio -o -H newc --quiet | gzip -9) > stage1.cpio.gz

      - name: Boot image
        run: |
          python3 kernel/linux72/mkboot.py out/arch/arm64/boot/Image stage1.cpio.gz             out/arch/arm64/boot/dts/qcom/$DTB.dtb             "rdinit=/init clk_ignore_unused pd_ignore_unused regulator_ignore_unused panic=0 loglevel=7 printk.devkmsg=on console=tty0 fbcon=font:TER16x32 fbcon=rotate:1"             boot_linux72_stage1.img
          mkdir -p result
          gzip -9 -k out/arch/arm64/boot/Image
          cp boot_linux72_stage1.img out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/$DTB.dtb result/
          cp out/.config result/config
          sha256sum result/* | tee result/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: linux72-stage1
          path: result/
